events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate limiting zone for food orders to prevent spam
    limit_req_zone $binary_remote_addr zone=food_limit:10m rate=20r/m;

    # Caching zone for Next.js SSR pages
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nextjs_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream nextjs_upstream {
        server nextjs_app:3000;
        # In a real AWS setup, this would be the container IP or localhost:3000
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Resource Vault (Static File Serving)
        # Directly serve PDFs without hitting Node.js
        location /static/vault/ {
            alias /var/www/vault/;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 2. Food Order Submission (Rate Limited)
        location /food {
            limit_req zone=food_limit burst=5 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Disable cache for the POST route explicitly
            proxy_cache off;
        }

        # 3. Cache the Read-Only Dashboard for 1 day
        location = / {
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Default routing for all other Next.js pages (Events, etc)
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
